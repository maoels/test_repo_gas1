<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CRUD Pegawai</title>
  
  <!-- Google Fonts: Poppins -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- Custom CSS -->
  <link rel="stylesheet" href="style.css">
</head>
<body class="bg-gradient-to-br from-blue-100 to-indigo-200 min-h-screen p-6 font-poppins text-gray-800">
  
  <div class="max-w-6xl mx-auto space-y-8 relative z-10">
    <header class="text-center">
      <h1 class="text-3xl font-bold text-indigo-900">Data Pegawai</h1>
      <p class="text-sm text-gray-600 mt-2">Manajemen Data Pegawai Internal</p>
    </header>

    <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
      
      <!-- Glassmorphism Form -->
      <div class="lg:col-span-1 glass-panel p-6 rounded-2xl shadow-xl h-fit">
        <h2 class="text-xl font-semibold mb-4 text-indigo-800" id="formTitle">Tambah Pegawai</h2>
        <form id="pegawaiForm" class="space-y-4">
          <input type="hidden" id="pegawaiId">
          
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Nama Lengkap</label>
            <input type="text" id="nama" required class="w-full px-4 py-2 bg-white/50 border border-white/40 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-400 backdrop-blur-sm transition-all">
          </div>
          
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">NIP</label>
            <input type="text" id="nip" required class="w-full px-4 py-2 bg-white/50 border border-white/40 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-400 backdrop-blur-sm transition-all">
          </div>

          <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Tempat Lahir</label>
            <input type="text" id="tempatLahir" required class="w-full px-4 py-2 bg-white/50 border border-white/40 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-400 backdrop-blur-sm transition-all">
          </div>

          <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Tanggal Lahir</label>
            <input type="date" id="tanggalLahir" required class="w-full px-4 py-2 bg-white/50 border border-white/40 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-400 backdrop-blur-sm transition-all">
          </div>

          <div class="flex gap-2 pt-2">
            <button type="submit" id="btnSubmit" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-medium py-2 px-4 rounded-lg transition-colors shadow-lg shadow-indigo-200">Simpan</button>
            <button type="button" id="btnBatal" class="hidden w-full bg-gray-500 hover:bg-gray-600 text-white font-medium py-2 px-4 rounded-lg transition-colors shadow-lg">Batal</button>
          </div>
        </form>
      </div>

      <!-- Zebra-striped Table Panel -->
      <div class="lg:col-span-2 glass-panel p-6 rounded-2xl shadow-xl flex flex-col justify-between">
        <div>
          <!-- Header Tabel & Tombol Refresh -->
          <div class="flex justify-between items-center mb-4">
            <h2 class="text-xl font-semibold text-indigo-800">Daftar Pegawai</h2>
            <button id="btnRefresh" class="text-indigo-600 hover:text-indigo-800 text-sm font-medium transition-colors">↻ Segarkan</button>
          </div>

          <!-- Kontrol Atas: Page Size & Search -->
          <div class="flex flex-col sm:flex-row justify-between items-center gap-3 mb-4">
            <div class="flex items-center gap-2 text-sm text-gray-700 w-full sm:w-auto">
              <span>Tampilkan</span>
              <select id="pageSize" class="px-3 py-1.5 bg-white/60 border border-white/50 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-400 backdrop-blur-sm text-sm">
                <option value="10" selected>10</option>
                <option value="25">25</option>
                <option value="50">50</option>
                <option value="100">100</option>
                <option value="all">Semua</option>
              </select>
              <span>data</span>
            </div>
            
            <div class="w-full sm:w-64">
              <input type="text" id="searchInput" placeholder="Cari Nama, NIP, Tempat..." class="w-full px-4 py-1.5 bg-white/60 border border-white/50 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-400 backdrop-blur-sm text-sm transition-all">
            </div>
          </div>
          
          <!-- Tabel Data -->
          <div class="overflow-x-auto rounded-lg border border-white/40">
            <table class="w-full text-left border-collapse">
              <thead class="bg-indigo-600/10 text-indigo-900 border-b border-white/50">
                <tr>
                  <th class="py-3 px-4 font-semibold text-sm">Nama</th>
                  <th class="py-3 px-4 font-semibold text-sm">NIP</th>
                  <th class="py-3 px-4 font-semibold text-sm">Tempat Lahir</th>
                  <th class="py-3 px-4 font-semibold text-sm">Tgl Lahir</th>
                  <th class="py-3 px-4 font-semibold text-sm text-center">Aksi</th>
                </tr>
              </thead>
              <tbody id="tableBody" class="divide-y divide-white/30 text-sm">
                <tr>
                  <td colspan="5" class="py-6 text-center text-gray-500">Memuat data...</td>
                </tr>
              </tbody>
            </table>
          </div>
        </div>

        <!-- Footer Tabel: Info Data & Tombol Paging -->
        <div class="flex flex-col sm:flex-row justify-between items-center gap-4 mt-4 pt-4 border-t border-white/40 text-sm text-gray-700">
          <div id="pageInfo" class="text-center sm:text-left">
            Menampilkan 0 - 0 dari 0 data
          </div>
          <div class="flex items-center gap-1" id="paginationControls">
            <!-- Tombol halaman di-render dinamis oleh JS -->
          </div>
        </div>

      </div>

    </div>
  </div>

  <!-- Import Custom JS -->
  <script src="app.js"></script>
</body>
</html>
